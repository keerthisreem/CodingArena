<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Users — Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand"><a th:href="@{/}"><i class="fas fa-code"></i> CodingArena</a></div>
    <div class="nav-links">
        <a th:href="@{/problems}"><i class="fas fa-list"></i> Problems</a>
        <a th:href="@{/admin}" class="nav-admin"><i class="fas fa-cog"></i> Admin</a>
        <a th:href="@{/profile}"><i class="fas fa-user"></i> <span sec:authentication="name">Admin</span></a>
        <a th:href="@{/logout}" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</nav>

<div class="page-content">
    <div class="page-header">
        <h1><i class="fas fa-users"></i> All Users</h1>
        <p>Registered coders on the platform.</p>
    </div>

    <div class="table-wrap">
        <table class="problems-table">
            <thead>
                <tr><th>#</th><th>Username</th><th>Email</th><th>Role</th><th>Score</th><th>Solved</th><th>Joined</th></tr>
            </thead>
            <tbody>
                <tr th:each="u, iter : ${users}">
                    <td th:text="${iter.count}">1</td>
                    <td class="coder-name" th:text="${u.username}">user</td>
                    <td th:text="${u.email}">email</td>
                    <td><span th:class="'badge ' + (${u.role.name() == 'ADMIN'} ? 'badge-hard' : 'badge-easy')"
                              th:text="${u.role}">USER</span></td>
                    <td><i class="fas fa-star"></i> <span th:text="${u.score}">0</span></td>
                    <td th:text="${u.problemsSolved}">0</td>
                    <td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}">date</td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="7" class="empty-msg">No users registered yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="footer"><p>&copy; 2025 CodingArena</p></footer>
</body>
</html>
